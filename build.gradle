/**
 * Top-level build file for ftc_app project.
 *
 * It is extraordinarily rare that you will ever need to edit this file.
 */

buildscript {
    repositories {
        mavenCentral()
        google()
    }
}

plugins {
    // Note for FTC Teams: Do not modify this yourself.
    id 'com.android.application' version '8.13.2' apply false
    id 'com.android.library' version '8.13.2' apply false
}

// This is now required because aapt2 has to be downloaded from the
// google() repository beginning with version 3.2 of the Android Gradle Plugin
allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

repositories {
    mavenCentral()
}

tasks.register('connectToHub', Exec) {
    group = 'verification'
    description = 'Connects ADB to the REV Control Hub via Wi-Fi.'
    ignoreExitValue = true

    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        // Dynamically grabs your Windows home directory (e.g., C:\Users\YourName)
        def userHome = System.getProperty("user.home")
        def adbPath = "${userHome}\\AppData\\Local\\Android\\Sdk\\platform-tools\\adb.exe"

        commandLine 'cmd', '/c', "${adbPath} connect 192.168.43.1:5555"
    } else {
        commandLine 'adb', 'connect', '192.168.43.1:5555'
    }
}
